name: Update teaser index and track pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.pdf'
      - '**/*.csv'
      - '**/*.xlsx'
      - '**/*.xls'
      - '**/*.txt'
      - '**/*.zip'
      - 'scripts/build_teaser_index.py'
      - 'scripts/build_track_pages.py'
      - '.github/workflows/update-teaser-index.yml'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: teaser-index-main
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate teaser index
        run: python scripts/build_teaser_index.py

      - name: Generate permanent track pages
        run: python scripts/build_track_pages.py

      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tracks/
          if ! git diff --cached --quiet; then
            git commit -m 'Update teaser index and track archives [skip ci]'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
