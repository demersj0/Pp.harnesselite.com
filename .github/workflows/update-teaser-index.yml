name: Update teaser index

on:
  push:
    branches: [main]
    paths:
      - "**/*teaser*.html"
      - "**/*Teaser*.html"
      - "scripts/build_teaser_index.py"
      - ".github/workflows/update-teaser-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teaser-index-main
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate teaser index
        run: python scripts/build_teaser_index.py

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update teaser index [skip ci]"
          git push

